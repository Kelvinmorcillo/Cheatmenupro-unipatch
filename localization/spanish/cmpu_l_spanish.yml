l_spanish:
 cmpu_fast_efficiency: "CMPU: Construction efficiency"
 cmpu_project_limit: "CMPU: Weekly construction per-project limit"
 cmpu_goods_cost: "CMPU: Construction goods cost reduction"
 cmpu_private_share: "CMPU: Private construction allocation"
 cmpu_construction_output: "CMPU: Additional construction output"
 CMPU_FAST_TT: "Left-click: +10% construction efficiency. Shift: +100%. Alt: +1000%. Ctrl: -10%. Right-click removes patch construction bonuses. Persistent; does not create construction-sector output."
 CMPU_CAP_TT: "Left-click toggles +1000 weekly construction progress per project. Ctrl: +10 percentage points private allocation. Right-click: -10 percentage points private allocation. This is not construction output."
 CMPU_COST_TT: "Player: left-click -10% construction goods cost; Shift -100%; Alt reaches the -100% floor; Ctrl +10%; right-click resets patch costs. Marked-country arrow retains the original menu target routing."
 CMPU_PRIVATE_TT: "Player: left-click +10 percentage points private allocation; Shift/Alt reaches the positive patch limit; Ctrl -10 points; right-click resets. Economic laws and available investment still matter."
 CMPU_OUTPUT: "Country construction output"
 CMPU_OUTPUT_TT: "Player country: left-click +100 construction points; Shift +1000; Alt +10000; Ctrl -100; right-click resets patch output. Separate from efficiency and per-project progress limits."
 CMPU_SECTOR_TT: "Marked states: left-click +20% construction-sector throughput; Shift +200%; Alt +5%; Ctrl -20%; right-click removes patch presets. Throughput changes sector inputs and output, unlike free country construction points."
 CMPU_BUILD_TT: "Choose a building and level. Left-click raises it to at least that level in all player states. Alt: incorporated player states only. Right-click: marked own states, or marked foreign states when no own states are marked. Level 0 removes the selected building. This sets a minimum, not an additive number of levels. Large levels affect every chosen state and can freeze or destabilize the game; use normal levels first."
